name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find project folder
        id: find
        run: |
          file=$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"
      - run: npm install
        working-directory: ${{ steps.find.outputs.dir }}
      - run: npm run build
        working-directory: ${{ steps.find.outputs.dir }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.dir }}/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
